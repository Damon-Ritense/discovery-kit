# Register: onderwerp -> skill -> contentbestand -> template.
# Een nieuw onderwerp toevoegen = een skill-map plus een regel hier; de write-skill verandert niet.
#
# scope: organisatie | eindgebruikers | technisch, of een lijst daarvan voor een gedeeld onderwerp.
# decks: organisatie | functioneel | technisch
# applies_when: always, of "pad == event-storming" / "pad == functionele-invulling"

- id: context
  scope: [organisatie, eindgebruikers]
  skill: discovery-context
  content: content/context.md
  template: templates/context.md
  decks: [organisatie, functioneel]
  applies_when: always

